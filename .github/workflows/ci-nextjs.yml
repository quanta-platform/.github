name: CI — Next.js

on:
  # See cd-cloud-run.yml for rationale — silences the "no jobs ran"
  # email when this reusable workflow file itself is edited.
  push:
    paths-ignore: ['**']
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"

jobs:
  ci:
    name: Lint, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
