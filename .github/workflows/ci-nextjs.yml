name: CI — Next.js

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      run-unit-tests:
        description: "Run the app's unit tests (pnpm test — Vitest, non-watch) before the build"
        type: boolean
        default: true
      test-timezone:
        description: >-
          TZ for the unit tests. Suites are expected to be timezone-independent
          (admin + storefront pass under UTC, Asia/Kolkata and America/Los_Angeles);
          pinning it keeps CI reproducible rather than relying on the runner image.
        type: string
        default: "UTC"

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm test` is `vitest run` in admin and storefront (single pass, no
      # watch). Tests that cross-read a sibling repo (api) skip themselves when
      # it isn't checked out, which it never is here.
      - name: Unit tests
        if: inputs.run-unit-tests
        env:
          TZ: ${{ inputs.test-timezone }}
          CI: "true"
        run: pnpm test

      - name: Build
        run: pnpm build
